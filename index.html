<html>

<head> 

<title> SNAKE </title>

<link rel="stylesheet" href="styles.css">

</head>

<body>

<div class="container" id="home">
    <button class="mainMenu" style="margin-inline: 100%; margin-top: 12%;" onclick="startGame()">Play</button>
    <label for="difficulty" style="margin-inline: 100%; font-size: 30px; margin-top: 30px; margin-bottom: 20px;">Difficulty</label>
    <input type="range" id="difficulty" style="width: 15vw; transform: scale(2); accent-color: green;" min="1" max="5" step="0.001" value="3">
</div>

<div id="gameplay" style="display: none;">
    <div class="container">Game tick: <div id="game"> </div></div>
    <div class="scoreboard"><div id="scoreboard"></div><div style="position: absolute; margin-top: 50px; font-size: 15px;">Score</div></div>
    <div class="container"><pre id="board" style="font-size: 25px;"> </pre></div>
    <div id="lowmessage" class="container" style="color:rgb(148, 20, 20); font-size: 35px; font-weight: bold; text-decoration: underline;"> </div>
</div>

<script src="snake.js"></script>
</body>

</html>
